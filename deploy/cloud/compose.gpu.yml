# On a host with an NVIDIA GPU (a Hetzner GEX45, HETZNER.md: The server), once the NVIDIA driver and the NVIDIA Container
# Toolkit are installed: `docker compose -f compose.yml -f compose.gpu.yml up -d`. The model, its build and every
# setting stay the same; only where Ollama computes changes.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
