# Verity on one Linux VM: Caddy (TLS, routing), the interface and the API. Only Caddy publishes ports; the API and the
# interface are reachable only through it. Run from this directory: `docker compose up -d` (README.md).
name: verity

# Every container's log rotates (json-file, 10 MB, three files): unrotated logs fill the disk, and a full disk makes
# health false and every upload fail. The logs carry ids and stages, never a contract's words
# (backend/tests/test_workspaces.py, ordinary logs).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.api
      target: runtime
      args:
        VERITY_BUILD_SHA: ${VERITY_BUILD_SHA:-}
    # Required: a missing tag once fell back to `local`, a stale build kept on the host (war room F-16, 2026-10-13).
    image: verity-api:${VERITY_TAG:?set VERITY_TAG in .env to the release to run (ORACLE.md, Build)}
    pull_policy: never
    # A stable name across restarts and redeploys: a stage row records the host, pid and start time of the process
    # running it, so runs the previous container left in flight are recovered at once (app/runs/owner.py).
    hostname: verity-api
    # The server is not pid 1, so the health check can end a server that stops answering (liveness.py).
    init: true
    # The host's configuration lives outside the release's source (ORACLE.md, Releases): VERITY_SHARED names it, and
    # a release directory is replaced whole, never edited. Unset, it is this folder, as on a single checkout.
    env_file: ${VERITY_SHARED:-.}/.env
    environment:
      WORKBENCH_DATA_DIR: /data
      WORKBENCH_CONTRACT_STATE: /app/record/contract-state.json
      # SQLite writes its temporary files under /var/tmp, on the container's disk, unless told otherwise; a purge's
      # statement journal can carry a contract's text (independent review, 2026-10-12, with a probe in the image).
      TMPDIR: /tmp
    volumes:
      - verity-data:/data
      # The frozen research record /state shows, read-only (README: the record). Absent, /state says it is unavailable.
      - ${VERITY_SHARED:-.}/contract-state.json:/app/record/contract-state.json:ro
    # Uploads over 1 MB are spooled to the temporary directory while they are read, and SQLite writes its temporary files
    # there (TMPDIR); in memory, a visitor's words never reach a disk that no retention pass covers. Four 25 MB uploads at
    # once used 121 MiB of it (rehearsal, 2026-10-12); the bound costs memory only when used.
    tmpfs:
      - /tmp:size=512m,mode=1777
    # What the API may take of the 4 GB host, its reading processes and the /tmp spool above included. Past it the
    # kernel kills a process inside this container, the largest, which is most likely a reading (refused as 413), never
    # one of the host's. Two readings at once, each ended past 768 MB (app/ingest/bounded.py), the API (112 MB at start,
    # a few hundred under work) with the two files being read, its fork server and a full spool (384 MiB, api/body_limit.py)
    # come to about 2.2 to 2.3 GiB at worst: under it, with little to spare.
    mem_limit: 2560m
    # No core file: a crashing reader would write memory holding a contract to disk.
    ulimits:
      core: 0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile.web
      args:
        NEXT_PUBLIC_BUILD_SHA: ${VERITY_BUILD_SHA:-}
        VERITY_BUILD_SHA: ${VERITY_BUILD_SHA:-}
    image: verity-web:${VERITY_TAG:?set VERITY_TAG in .env to the release to run (ORACLE.md, Build)}
    pull_policy: never
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

  # The edge, one of two, chosen by COMPOSE_PROFILES in .env (README: the edge):
  #   caddy:  a host with its own public address; Caddy terminates TLS (Let's Encrypt) and routes by path.
  #   tunnel: a host with no inbound port; a Cloudflare Tunnel connector routes by path, as on the workstation.
  caddy:
    profiles: ["caddy"]
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    ports:
      - "${VERITY_HTTP_PORT:-80}:80"
      - "${VERITY_HTTPS_PORT:-443}:443"
    environment:
      VERITY_SITE: ${VERITY_SITE:-}
      VERITY_TLS: ${VERITY_TLS:-}
      VERITY_ACME_CA: ${VERITY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
      - web

  tunnel:
    profiles: ["tunnel"]
    # The workstation's cloudflared version, pinned by digest (amd64 and arm64).
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    # One tunnel per origin, never shared with another host: Cloudflare sends each request to the nearest connector of a
    # tunnel, so a second host on the same tunnel would put a second store behind the same name.
    # HTTP/2 over TCP, not QUIC: on the staging host (Hetzner, 2026-10-13) every QUIC connection dropped together for three
    # minutes ("timeout: no recent network activity") and a request in that window was answered 502 by Cloudflare.
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run ${VERITY_TUNNEL_ID:-}
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      # The tunnel's credentials: whoever holds them can run a connector and receive the site's traffic.
      - ${VERITY_SHARED:-.}/tunnel.json:/etc/cloudflared/tunnel.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api
      - web

# No volume for backups: a copy of the public store holds visitors' contracts past the deletion the first screen
# promises (README: backups and retention).
volumes:
  # The store, named by the host's role and required: a staging store must never become a production one by being
  # left in place (release integration, 2026-10-13). An existing store keeps its name in .env (ORACLE.md, Stores).
  verity-data:
    name: ${VERITY_STORE:?set VERITY_STORE in .env to this host's store (ORACLE.md, Stores)}
  caddy-data:
  caddy-config:
